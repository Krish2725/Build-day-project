<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Clicker</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"> -->
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            /* font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; */
             font-family: "Bitcount Prop Single", system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #8D86C9;
            color: #ffffff;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p {
            color: #F7ECE1;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
             font-family: "Bitcount Prop Single", system-ui;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.95);
        }

        #enable-btn {
            background-color: #9067c6;
            color: white;
        }

        #send-btn {
            background-color: #242038;
            color: white;
        }

        button:disabled {
            background-color: #cac4ce;
            color: #CAC4CE;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <h1><i class="fa-solid fa-bell"></i> Notification Clicker</h1>
    <p>Click "Enable" first, then "Send"!</p>

    <div class="button-container">
        <button id="enable-btn">
            <i class="fa-solid fa-lock-open"></i> Enable Notifications
        </button>

        <button id="send-btn" disabled>
            <i class="fa-solid fa-paper-plane"></i> Send Notification
        </button>
    </div>

    <script>
        const enableBtn = document.getElementById('enable-btn');
        const sendBtn = document.getElementById('send-btn');

        
        enableBtn.addEventListener('click', () => {
            Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                    console.log("Permission granted!");
                    new Notification("Awesome!", { body: "You can now receive notifications." });
                }
                updateButtonState();
            });
        });

    
        sendBtn.addEventListener('click', () => {
            if (Notification.permission === "granted") {

               
                const notification = new Notification("Hello!", {
                    body: "👋 Hey there!",
                    icon: "https://cdn-icons-png.flaticon.com/512/3119/3119338.png"
                });

               
                setTimeout(() => notification.close(), 4000);
            } else {
                alert("Please enable notifications first.");
            }
        });

       
        function updateButtonState() {
            if (Notification.permission === 'granted') {
                enableBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Permission Granted';
                enableBtn.disabled = true;
                sendBtn.disabled = false;
            } else if (Notification.permission === 'denied') {
                enableBtn.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Permission Denied';
                enableBtn.disabled = true;
                sendBtn.disabled = true;
            }
        }
    </script>
</body>

</html>
